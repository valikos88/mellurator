name: Build Mellurator (Windows VST3)

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Mellurator

      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE

      - name: Configure
        working-directory: Mellurator
        run: cmake -B build -A x64

      - name: Build
        working-directory: Mellurator
        run: cmake --build build --config Release --target Mellurator_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Mellurator-VST3
          path: Mellurator/build/Mellurator_artefacts/Release/VST3/
